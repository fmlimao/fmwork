# version: "3"

services:

  mailhog:
    container_name: "fmwork-mailhog"
    image: mailhog/mailhog
    expose:
      - 1025
      - 8025
    ports:
      - 8102:1025 # smtp server
      - 8103:8025 # web ui

  mysql:
    container_name: "fmwork-mysql"
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: fmwork
    ports:
      - "8104:3306"
    volumes:
      - ./docker/volumes/mysql/data:/var/lib/mysql
    # logging:
    #   driver: none
